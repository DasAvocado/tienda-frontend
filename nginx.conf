# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (/carrito, /pago, /ordenes, /notificaciones) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin cache (para que tome siempre la ultima version desplegada)
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
